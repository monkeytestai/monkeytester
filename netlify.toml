# VitePress docs → docs.monkeytest.ai
#
# The live site is Vercel, not Netlify. Vercel ignores this file.
# Clean URLs in production come from /vercel.json (`cleanUrls: true`).
# Keep this file so a Netlify deploy of the same repo still serves
# extensionless paths and the moved pages.

[build]
  command = "npm ci && npm run docs:build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/hero.jpg"
  to = "/og.png"
  status = 301

